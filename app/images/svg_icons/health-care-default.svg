<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hc-shield" x1="64" y1="12" x2="64" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA8FE"/><stop offset="1" stop-color="#3B6FE0"/>
    </linearGradient>
    <linearGradient id="hc-cross" x1="64" y1="42" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="hc-pulse" x1="32" y1="66" x2="96" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12B5A6"/><stop offset="1" stop-color="#34E0CE"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="118" rx="38" ry="6" fill="#33415C" opacity="0.08"/>

  <!-- shield shape -->
  <path d="M64 12 L108 30 L108 68 C108 92 88 110 64 118 C40 110 20 92 20 68 L20 30 Z" fill="url(#hc-shield)"/>

  <!-- inner shield highlight -->
  <path d="M64 22 L100 37 L100 68 C100 88 84 104 64 111 C44 104 28 88 28 68 L28 37 Z" fill="#EAF2FF" opacity="0.18"/>

  <!-- medical cross -->
  <!-- vertical bar -->
  <rect x="55" y="42" width="18" height="48" rx="6" fill="url(#hc-cross)"/>
  <!-- horizontal bar -->
  <rect x="40" y="57" width="48" height="18" rx="6" fill="url(#hc-cross)"/>

  <!-- pulse / heartbeat line on cross -->
  <path d="M40 66 L50 66 L55 55 L60 77 L65 60 L70 72 L74 66 L88 66"
        stroke="url(#hc-pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- small heart on top of cross -->
  <path d="M64 44 c-2.5-2.5-7 0-7 4.5 0 3.5 7 8 7 8s7-4.5 7-8c0-4.5-4.5-7-7-4.5z"
        fill="#FF9AAE" opacity="0.85"/>

  <!-- decorative plus -->
  <path d="M104 106v8M100 110h8" stroke="#FFC58A" stroke-width="2" stroke-linecap="round"/>
  <!-- teal dot -->
  <circle cx="22" cy="26" r="2.4" fill="#34E0CE"/>
</svg>
